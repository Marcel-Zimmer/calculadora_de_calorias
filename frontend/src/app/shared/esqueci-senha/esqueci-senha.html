@if (mostrarModal()) {
    <div class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/60 backdrop-blur-sm animate-fade-in">
        <div class="bg-white w-full max-w-md rounded-[2.5rem] shadow-2xl overflow-hidden animate-slide-up">
            
            <div class="p-8 pb-0 text-center">
                <div class="w-16 h-16 bg-amber-100 text-amber-600 rounded-2xl flex items-center justify-center mx-auto mb-4 text-3xl shadow-inner">
                    🔑
                </div>
                <h2 class="text-2xl font-black text-slate-800 tracking-tight">RECUPERAR ACESSO</h2>
                <p class="text-sm text-slate-500 mt-2">Enviaremos um link para o seu e-mail</p>
            </div>

            <div class="p-8 space-y-6">
                <div class="space-y-1">
                    <label class="text-[10px] font-black text-slate-400 uppercase ml-1 tracking-widest">Seu E-mail</label>
                    <input type="email" placeholder="exemplo@email.com" [(ngModel)]="email"
                        class="w-full bg-slate-50 border border-slate-400 rounded-2xl px-5 py-4 text-sm focus:ring-2 focus:ring-amber-500 focus:bg-white outline-none transition-all">
                </div>

                <div class="flex gap-4">
                    <button (click)="fechar()" 
                        class="flex-1 bg-slate-100 hover:bg-slate-200 text-slate-600 py-4 rounded-2xl font-black text-lg transition-all active:scale-[0.98]">
                        Cancelar
                    </button>
                    <button (click)="enviar()" [disabled]="carregando()"
                        class="flex-1 bg-amber-500 hover:bg-amber-600 text-white py-4 rounded-2xl font-black text-lg shadow-lg shadow-amber-200 transition-all active:scale-[0.98] disabled:opacity-50">
                        @if (carregando()) {
                            <span class="inline-block animate-spin mr-2">⏳</span>
                        }
                        Enviar
                    </button>
                </div>
            </div>
        </div>
    </div>
}
