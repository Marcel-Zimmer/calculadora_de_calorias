<div *ngIf="mostrarModal()" class="fixed inset-0 z-[200] flex items-center justify-center p-4 sm:p-6">
    <div (click)="fechar()" class="absolute inset-0 bg-slate-900/60 backdrop-blur-sm transition-opacity"></div>
  
    <div class="relative w-full max-w-lg bg-white rounded-[2.5rem] shadow-2xl overflow-hidden animate-in zoom-in duration-300">
      
      <!-- Header -->
      <div class="bg-sky-600 p-8 text-white relative">
        <button (click)="fechar()" class="absolute top-6 right-6 p-2 hover:bg-white/10 rounded-full transition-colors">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
        </button>
        <div class="flex items-center space-x-4 mb-2">
          <div class="w-12 h-12 bg-white/20 rounded-2xl flex items-center justify-center text-2xl">⚖️</div>
          <h2 class="text-2xl font-black">Nova Pesagem</h2>
        </div>
        <p class="text-sky-100 text-sm">Mantenha seu registro atualizado para acompanhar sua evolução.</p>
      </div>
  
      <div class="p-8 space-y-6">
        <!-- Input Peso -->
        <div>
          <label class="block text-[10px] font-black text-slate-400 uppercase tracking-widest mb-2">Peso Atual (kg)</label>
          <div class="relative group">
            <input 
              type="number" 
              [(ngModel)]="peso"
              placeholder="00.0"
              class="w-full bg-slate-50 border-2 border-slate-100 rounded-3xl pl-6 pr-20 py-4 text-2xl font-black text-slate-800 focus:border-sky-500 focus:bg-white outline-none transition-all"
            >
            <span class="absolute right-12 top-1/2 -translate-y-1/2 text-slate-400 font-bold pointer-events-none">kg</span>
          </div>
        </div>

        <!-- Meta Calórica -->
        <div>
            <label class="block text-[10px] font-black text-slate-400 uppercase tracking-widest mb-2">Meta Calórica Diária (Opcional)</label>
            <div class="relative group">
              <input 
                type="number" 
                [(ngModel)]="metaCalorica"
                placeholder="2000"
                class="w-full bg-slate-50 border-2 border-slate-100 rounded-3xl pl-6 pr-24 py-4 text-xl font-black text-slate-800 focus:border-sky-500 focus:bg-white outline-none transition-all"
              >
              <span class="absolute right-12 top-1/2 -translate-y-1/2 text-slate-400 font-bold pointer-events-none">kcal</span>
            </div>
            <p class="mt-2 text-[10px] text-slate-400 italic">Sua meta atual será sugerida automaticamente.</p>
          </div>
  
        <!-- Footer / Actions -->
        <div class="flex space-x-3 pt-4">
          <button (click)="fechar()" class="flex-1 px-6 py-4 rounded-3xl font-bold text-slate-500 hover:bg-slate-50 transition-colors">
            Cancelar
          </button>
          <button 
            (click)="salvar()" 
            [disabled]="carregando()"
            class="flex-[2] bg-sky-600 hover:bg-sky-700 disabled:opacity-50 text-white px-6 py-4 rounded-3xl font-bold shadow-lg shadow-sky-100 transition-all active:scale-95 flex items-center justify-center space-x-2">
            <span *ngIf="!carregando()">Confirmar Pesagem</span>
            <span *ngIf="carregando()">Salvando...</span>
          </button>
        </div>
      </div>
    </div>
  </div>
