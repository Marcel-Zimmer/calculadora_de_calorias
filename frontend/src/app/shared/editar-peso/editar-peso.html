<div *ngIf="mostrarModal()" class="fixed inset-0 z-[200] flex items-center justify-center p-4 sm:p-6">
    <div (click)="fechar()" class="absolute inset-0 bg-slate-900/60 backdrop-blur-sm transition-opacity"></div>
  
    <div class="relative w-full max-w-md bg-white rounded-[2.5rem] shadow-2xl overflow-hidden animate-in zoom-in duration-300">
      
      <!-- Header -->
      <div class="bg-slate-800 p-8 text-white relative">
        <button (click)="fechar()" class="absolute top-6 right-6 p-2 hover:bg-white/10 rounded-full transition-colors">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
        </button>
        <div class="flex items-center space-x-4 mb-2">
          <div class="w-12 h-12 bg-white/20 rounded-2xl flex items-center justify-center text-2xl">📝</div>
          <div>
              <h2 class="text-xl font-black">Registro de Peso</h2>
              <p class="text-slate-400 text-[10px] font-bold uppercase tracking-widest">{{ registro()?.legenda }}</p>
          </div>
        </div>
      </div>
  
      <div class="p-8 space-y-6">
        <div>
          <label class="block text-[10px] font-black text-slate-400 uppercase tracking-widest mb-2">Ajustar Peso (kg)</label>
          <div class="relative group">
            <input 
              type="number" 
              [(ngModel)]="novoPeso"
              class="w-full bg-slate-50 border-2 border-slate-100 rounded-3xl pl-6 pr-20 py-4 text-2xl font-black text-slate-800 focus:border-indigo-500 focus:bg-white outline-none transition-all"
            >
            <span class="absolute right-12 top-1/2 -translate-y-1/2 text-slate-400 font-bold pointer-events-none">kg</span>
          </div>
        </div>
  
        <!-- Actions -->
        <div class="space-y-3 pt-4">
            <button 
                (click)="salvar()" 
                [disabled]="carregando()"
                class="w-full bg-indigo-600 hover:bg-indigo-700 disabled:opacity-50 text-white px-6 py-4 rounded-3xl font-bold shadow-lg shadow-indigo-100 transition-all active:scale-95 flex items-center justify-center space-x-2">
                <span>Salvar Alteração</span>
            </button>

            <button 
                (click)="excluir()" 
                [disabled]="carregando()"
                class="w-full bg-rose-50 text-rose-600 hover:bg-rose-100 px-6 py-4 rounded-3xl font-bold transition-all active:scale-95 flex items-center justify-center space-x-2">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
                <span>Excluir Registro</span>
            </button>
        </div>
      </div>
    </div>
  </div>
