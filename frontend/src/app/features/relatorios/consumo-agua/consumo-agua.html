<div class="space-y-6 animate-fade-in">
    <!-- Header com Toggle de Período -->
    <div class="flex flex-col md:flex-row md:items-center justify-between gap-4 bg-white p-6 rounded-3xl shadow-sm border border-slate-100">
        <div>
            <h3 class="text-xl font-black text-slate-800">Relatório de Hidratação</h3>
            <p class="text-slate-500 text-xs">Análise detalhada do seu consumo de água.</p>
        </div>
        <div class="flex bg-slate-100 p-1 rounded-2xl">
            <button (click)="alterarPeriodo('semanal')" [class]="periodoEstatisticas() === 'semanal' ? 'bg-white shadow-sm text-blue-600 font-bold' : 'text-slate-500'" class="px-6 py-2 text-xs rounded-xl transition-all">Semanal</button>
            <button (click)="alterarPeriodo('mensal')" [class]="periodoEstatisticas() === 'mensal' ? 'bg-white shadow-sm text-blue-600 font-bold' : 'text-slate-500'" class="px-6 py-2 text-xs rounded-xl transition-all">Mensal</button>
        </div>
    </div>

    <!-- Grid de Cards de Resumo -->
    <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
        @for (card of cardsMediaConsumo(); track card.titulo) {
            <app-bs-card-media-item 
                [icone]="card.icone" 
                [corCss]="card.corCss" 
                [titulo]="card.titulo" 
                [valor]="card.valor" 
                [legenda]="card.legenda"
                [isText]="card.isText">
            </app-bs-card-media-item>
        }

        <app-bs-card-consistencia 
            [diasNaMeta]="dadosEstatisticas()?.diasNaMeta || 0" 
            [totalDias]="dadosEstatisticas()?.totalDias || 0">
        </app-bs-card-consistencia>
    </div>

    <!-- Gráficos e Insights -->
    <div class="grid grid-cols-1 lg:grid-cols-12 gap-6">
        <div class="lg:col-span-8 space-y-6">
            <div class="bg-white p-6 rounded-3xl shadow-sm border border-slate-100">
                <app-bs-grafico-media-semanal *ngIf="periodoEstatisticas() === 'semanal'"
                    titulo="Consumo Semanal (ml)" 
                    [dados]="dadosHistoricoConsumo()" 
                    [metaDiaria]="dadosEstatisticas()?.metaAguaDiaria || 2000"
                    [pintarPorMeta]="true">
                </app-bs-grafico-media-semanal>

                <app-bs-grafico-historico-mensal *ngIf="periodoEstatisticas() === 'mensal'"
                    titulo="Histórico Mensal (ml)" 
                    [dados]="dadosHistoricoConsumo()"
                    [metaDiaria]="dadosEstatisticas()?.metaAguaDiaria || 2000"
                    [pintarPorMeta]="true">
                </app-bs-grafico-historico-mensal>
            </div>
        </div>

        <div class="lg:col-span-4 space-y-4">
            <app-bs-card-maior-ingestao *ngIf="dadosEstatisticas()?.maiorConsumo > 0"
                [maiorIngestao]="dadosEstatisticas()?.maiorConsumo"
                [diaMaiorIngestao]="dadosEstatisticas()?.diaMaiorConsumo">
            </app-bs-card-maior-ingestao>
        </div>
    </div>
</div>
